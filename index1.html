<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renji Run - Global Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .font-game {
            font-family: 'Fredoka One', cursive;
        }
        canvas {
            image-rendering: pixelated;
        }
        /* Custom scrollbar for leaderboard */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 select-none">

    <!-- Main Outer Container -->
    <div class="relative w-full max-w-4xl bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border-4 border-slate-700 flex flex-col items-center">
        
        <!-- Header Controls & High Score Banner -->
        <div class="w-full bg-slate-800/90 px-4 sm:px-6 py-3 flex justify-between items-center z-10 border-b border-slate-700/50">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🐱</span>
                <h1 class="font-game text-xl sm:text-2xl tracking-wide text-pink-400">Renji Run</h1>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-4 font-game text-xs sm:text-base">
                <div class="bg-slate-900/60 px-3 py-1 rounded-full border border-slate-700 text-amber-300">
                    HI: <span id="highScoreText">00000</span>
                </div>
                <div class="bg-slate-900/60 px-3 py-1 rounded-full border border-slate-700 text-slate-100">
                    SCORE: <span id="scoreText">00000</span>
                </div>
                <button id="audioToggleBtn" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-full text-base sm:text-lg transition duration-200">
                    🔊
                </button>
            </div>
        </div>

        <!-- Canvas Game Container -->
        <div class="relative w-full bg-slate-900 aspect-[16/8] sm:aspect-[16/6] overflow-hidden flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Landing / Customization & Leaderboard Overlay -->
            <div id="startOverlay" class="absolute inset-0 bg-slate-900/95 backdrop-blur-md flex flex-col items-center justify-between p-4 z-20 overflow-y-auto">
                <div class="w-full max-w-3xl flex flex-col items-center gap-4 my-auto">
                    
                    <!-- Title -->
                    <div class="text-center">
                        <h2 class="font-game text-3xl sm:text-4xl text-pink-400 tracking-wider">Renji Sprint</h2>
                        <p class="text-slate-400 text-xs sm:text-sm">Customize your kitty & challenge the world!</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full bg-slate-800/80 p-4 sm:p-5 rounded-2xl border border-slate-700">
                        
                        <!-- Left Column: Customization -->
                        <div class="flex flex-col items-center justify-center gap-3 border-b md:border-b-0 md:border-r border-slate-700/80 pb-4 md:pb-0 md:pr-4">
                            
                            <!-- Cat Live Preview Canvas -->
                            <div class="relative w-28 h-24 bg-slate-900 rounded-xl border border-slate-700 flex items-center justify-center overflow-hidden shadow-inner">
                                <canvas id="previewCanvas" width="110" height="95"></canvas>
                            </div>

                            <!-- Cat Name Input -->
                            <div class="w-full max-w-xs">
                                <label class="block text-xs font-bold text-slate-400 mb-1 text-center uppercase tracking-wider">Miming's Name</label>
                                <input type="text" id="catNameInput" maxlength="12" value="" placeholder="Enter name..." class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-center text-sm font-game text-pink-300 focus:outline-none focus:border-pink-500 shadow-inner">
                            </div>

                            <!-- Cat Color Selection -->
                            <div class="w-full max-w-xs">
                                <label class="block text-xs font-bold text-slate-400 mb-1.5 text-center uppercase tracking-wider">Skin Color</label>
                                <div class="flex justify-center gap-2" id="colorPickerGroup">
                                    <button data-color="#f97316" data-dark="#ea580c" class="color-btn w-8 h-8 rounded-full bg-orange-500 ring-2 ring-white scale-110 transition-all"></button>
                                    <button data-color="#3b82f6" data-dark="#2563eb" class="color-btn w-8 h-8 rounded-full bg-blue-500 ring-2 ring-transparent transition-all"></button>
                                    <button data-color="#334155" data-dark="#0f172a" class="color-btn w-8 h-8 rounded-full bg-slate-700 ring-2 ring-transparent transition-all"></button>
                                    <button data-color="#ec4899" data-dark="#db2777" class="color-btn w-8 h-8 rounded-full bg-pink-500 ring-2 ring-transparent transition-all"></button>
                                    <button data-color="#22c55e" data-dark="#16a34a" class="color-btn w-8 h-8 rounded-full bg-green-500 ring-2 ring-transparent transition-all"></button>
                                </div>
                            </div>
                        </div>

                        <!-- Right Column: Leaderboard -->
                        <div class="flex flex-col h-full min-h-[180px]">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-amber-400 text-sm">🏆</span>
                                    <span class="font-game text-sm text-slate-200">GLOBAL LEADERBOARD</span>
                                </div>
                                <span id="dbStatusBadge" class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full font-mono">
                                    Connecting...
                                </span>
                            </div>

                            <!-- High Scores Table -->
                            <div id="leaderboardList" class="flex-1 bg-slate-900/90 rounded-xl border border-slate-700 p-2 overflow-y-auto max-h-[160px] text-xs divide-y divide-slate-800">
                                <div class="text-center text-slate-500 py-6">Loading scores...</div>
                            </div>
                        </div>
                    </div>

                    <!-- Start Button -->
                    <button id="startBtn" class="font-game text-base sm:text-lg bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-white px-10 py-3 rounded-2xl shadow-lg hover:scale-105 active:scale-95 transition-all duration-150">
                        PRESS SPACE / TAP TO PLAY
                    </button>

                    <div class="flex justify-center gap-4 text-xs text-slate-400">
                        <div class="flex items-center gap-1"><kbd class="bg-slate-700 px-2 py-0.5 rounded text-slate-200">Space / ↑</kbd> Jump</div>
                        <div class="flex items-center gap-1"><kbd class="bg-slate-700 px-2 py-0.5 rounded text-slate-200">↓</kbd> Duck</div>
                    </div>
                </div>
            </div>

            <!-- Overlay: Game Over Screen -->
            <div id="gameOverOverlay" class="absolute inset-0 bg-slate-900/90 backdrop-blur-sm flex flex-col items-center justify-center p-4 z-20 hidden">
                <div class="text-center w-full max-w-sm">
                    <div class="text-5xl mb-1 animate-bounce">😿</div>
                    <h2 class="font-game text-3xl text-rose-400 mb-1">GAME OVER</h2>
                    <p id="gameOverCatName" class="text-slate-300 text-sm font-semibold mb-3">Whiskers hit an obstacle!</p>
                    
                    <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 mb-4 flex justify-around font-game">
                        <div>
                            <div class="text-[10px] text-slate-400 uppercase">Final Score</div>
                            <div id="finalScore" class="text-xl text-pink-400">0</div>
                        </div>
                        <div class="border-r border-slate-700"></div>
                        <div>
                            <div class="text-[10px] text-slate-400 uppercase">Your Best</div>
                            <div id="finalBest" class="text-xl text-amber-300">0</div>
                        </div>
                    </div>

                    <div id="newRecordMsg" class="hidden mb-3 bg-amber-500/20 text-amber-300 border border-amber-500/40 py-1.5 px-3 rounded-lg text-xs font-game animate-pulse">
                        🎉 NEW GLOBAL HIGH SCORE!
                    </div>

                    <div class="flex gap-2">
                        <button id="restartBtn" class="flex-1 font-game text-sm bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white py-3 rounded-xl shadow-lg hover:scale-105 active:scale-95 transition-all duration-150">
                            PLAY AGAIN
                        </button>
                        <button id="menuBtn" class="font-game text-sm bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-3 rounded-xl transition">
                            MENU
                        </button>
                    </div>
                </div>
            </div>

            <!-- Pause Overlay -->
            <div id="pauseOverlay" class="absolute top-4 right-4 bg-slate-800/80 text-amber-400 font-game px-4 py-2 rounded-xl text-sm border border-slate-700 hidden">
                PAUSED (ESC)
            </div>
        </div>

        <!-- Touch Controls for Mobile -->
        <div class="w-full bg-slate-800/90 p-3 sm:hidden flex gap-3 border-t border-slate-700">
            <button id="touchDuckBtn" class="flex-1 bg-slate-700 active:bg-slate-600 border border-slate-600 rounded-xl py-3.5 font-game text-slate-200 text-base flex items-center justify-center gap-2 active:scale-98 transition">
                <span>👇</span> DUCK
            </button>
            <button id="touchJumpBtn" class="flex-2 w-2/3 bg-pink-600 active:bg-pink-500 border border-pink-500 rounded-xl py-3.5 font-game text-white text-base flex items-center justify-center gap-2 active:scale-98 transition shadow-lg">
                <span>🚀</span> JUMP
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration & State Initialization
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cat-runner-game';
        const firebaseConfig = {
  apiKey: "AIzaSyBE-OnIkBv1kpzDjjIqd86g5AXYk4ZW8WE",
  authDomain: "renji-run.firebaseapp.com",
  projectId: "renji-run",
  storageBucket: "renji-run.firebasestorage.app",
  messagingSenderId: "705893689833",
  appId: "1:705893689833:web:a4521908cdfa7d8b1d0378",
  measurementId: "G-TEDGKH12RZ"
};

        let app, db, auth, user = null;
        let isFirebaseOnline = false;

        // Custom Cat Colors State
        let currentCatColor = '#f97316';
        let currentCatDarkColor = '#ea580c';
        let catName = localStorage.getItem('cat_runner_name') || 'Whiskers';

        

        // Firebase Initialization Function
        async function initFirebase() {
            const badge = document.getElementById('dbStatusBadge');
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Authenticate
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                user = auth.currentUser;
                if (user) {
                    isFirebaseOnline = true;
                    badge.textContent = "● LIVE SCORE";
                    badge.className = "text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full font-mono";
                    subscribeToLeaderboard();
                } else {
                    throw new Error("User authentication failed.");
                }
            } catch (err) {
                console.warn("Firebase not connected, falling back to local scores:", err);
                isFirebaseOnline = false;
                badge.textContent = "LOCAL MODE";
                badge.className = "text-[10px] bg-slate-800 text-amber-400 border border-amber-700/50 px-2 py-0.5 rounded-full font-mono";
                renderLocalLeaderboard();
            }
        }

        // Leaderboard Firebase Realtime Listener (Rule 1 & Rule 2 compliant path)
        function subscribeToLeaderboard() {
            if (!db || !user) return;
            const scoresCollection = collection(db, 'artifacts', appId, 'public', 'data', 'high_scores');

            onSnapshot(scoresCollection, (snapshot) => {
                const scores = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data && typeof data.score === 'number') {
                        scores.push(data);
                    }
                });

                // Sort in JS Memory to avoid compound query/index requirements
                scores.sort((a, b) => b.score - a.score);
                const top10 = scores.slice(0, 10);
                renderLeaderboardUI(top10);
            }, (error) => {
                console.warn("Firestore subscription error:", error);
                renderLocalLeaderboard();
            });
        }

        // Save Score to Firestore
        async function saveScoreToFirebase(finalScore) {
            if (!isFirebaseOnline || !db || !user || finalScore <= 0) return;
            try {
                const scoresCollection = collection(db, 'artifacts', appId, 'public', 'data', 'high_scores');
                await addDoc(scoresCollection, {
                    catName: catName.trim() || 'Whiskers',
                    score: Math.floor(finalScore),
                    color: currentCatColor,
                    userId: user.uid,
                    timestamp: Date.now()
                });
            } catch (err) {
                console.error("Failed to save score to Firebase:", err);
            }
        }

        // Render Leaderboard UI
        function renderLeaderboardUI(scoresList) {
            const container = document.getElementById('leaderboardList');
            if (!scoresList || scoresList.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-6">No scores yet. Be the first!</div>`;
                return;
            }

            container.innerHTML = scoresList.map((item, idx) => {
                const rankBadge = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
                const name = item.catName || 'Whiskers';
                const scoreVal = String(item.score).padStart(5, '0');
                const catColor = item.color || '#f97316';

                return `
                    <div class="flex items-center justify-between py-1.5 px-2 hover:bg-slate-800/50 rounded transition">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="w-5 text-center font-bold text-slate-400">${rankBadge}</span>
                            <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${catColor}"></span>
                            <span class="font-game text-slate-200 truncate max-w-[100px]">${escapeHtml(name)}</span>
                        </div>
                        <span class="font-game text-amber-300 font-semibold">${scoreVal}</span>
                    </div>
                `;
            }).join('');
        }

        // Local Leaderboard Fallback
        function renderLocalLeaderboard() {
            const localScores = JSON.parse(localStorage.getItem('cat_runner_local_scores') || '[]');
            renderLeaderboardUI(localScores);
        }

        function saveLocalScore(finalScore) {
            const localScores = JSON.parse(localStorage.getItem('cat_runner_local_scores') || '[]');
            localScores.push({
                catName: catName.trim() || 'Whiskers',
                score: Math.floor(finalScore),
                color: currentCatColor,
                timestamp: Date.now()
            });
            localScores.sort((a, b) => b.score - a.score);
            const top5 = localScores.slice(0, 5);
            localStorage.setItem('cat_runner_local_scores', JSON.stringify(top5));
            if (!isFirebaseOnline) {
                renderLeaderboardUI(top5);
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playScore() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.3);
            }

            playMeowGameOver() {
                if (!this.enabled || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(700, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.15);
                osc.frequency.linearRampToValueAtTime(200, now + 0.4);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.4);
            }
        }

        const audio = new SoundFX();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const VIRTUAL_WIDTH = 800;
        const VIRTUAL_HEIGHT = 300;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const GROUND_Y = 240;
        let gameSpeed = 6;
        const INITIAL_SPEED = 6;
        const MAX_SPEED = 14;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('cat_runner_hi_score') || '0', 10);
        let gameRunning = false;
        let isPaused = false;
        let animationFrameId = null;
        let lastTime = 0;
        let obstacleTimer = 0;
        let nextObstacleDistance = 100;

        const themes = {
            day: { bgSky: '#1e293b', bgClouds: '#334155', ground: '#475569', groundLine: '#64748b', sunMoon: '#fef08a' },
            dusk: { bgSky: '#31103f', bgClouds: '#581c87', ground: '#3b0764', groundLine: '#7e22ce', sunMoon: '#f43f5e' },
            night: { bgSky: '#0f172a', bgClouds: '#1e293b', ground: '#0f172a', groundLine: '#334155', sunMoon: '#e2e8f0' }
        };
        let currentTheme = themes.day;

        class CatPlayer {
            constructor() {
                this.x = 80;
                this.y = GROUND_Y;
                this.width = 44;
                this.height = 42;
                this.vy = 0;
                this.gravity = 0.75;
                this.jumpStrength = -13.5;
                this.isGrounded = true;
                this.isDucking = false;
                this.animFrame = 0;
                this.animTimer = 0;
            }

            reset() {
                this.y = GROUND_Y;
                this.vy = 0;
                this.isGrounded = true;
                this.isDucking = false;
            }

            jump() {
                if (this.isGrounded) {
                    this.vy = this.jumpStrength;
                    this.isGrounded = false;
                    audio.playJump();
                    createDustParticles(this.x + 20, GROUND_Y);
                }
            }

            duck(ducking) {
                if (this.isGrounded) {
                    this.isDucking = ducking;
                }
            }

            update(dt) {
                if (!this.isGrounded) {
                    this.vy += this.gravity;
                    this.y += this.vy;

                    if (this.isDucking) {
                        this.vy += 0.8;
                    }

                    if (this.y >= GROUND_Y) {
                        this.y = GROUND_Y;
                        this.vy = 0;
                        this.isGrounded = true;
                        createDustParticles(this.x + 20, GROUND_Y);
                    }
                }

                this.animTimer += dt;
                if (this.animTimer > 0.1) {
                    this.animFrame = (this.animFrame + 1) % 4;
                    this.animTimer = 0;
                }
            }

            getHitbox() {
                const padding = 6;
                if (this.isDucking && this.isGrounded) {
                    return {
                        x: this.x + padding,
                        y: this.y - 22 + padding,
                        width: 52 - padding * 2,
                        height: 22 - padding
                    };
                }
                return {
                    x: this.x + padding,
                    y: this.y - this.height + padding,
                    width: this.width - padding * 2,
                    height: this.height - padding * 1.5
                };
            }

            draw(ctx, scale, customX = null, customY = null) {
                ctx.save();
                if (scale !== 1) ctx.scale(scale, scale);

                const renderX = customX !== null ? customX : this.x;
                const renderY = customY !== null ? customY : this.y;

                if (this.isDucking && this.isGrounded) {
                    ctx.fillStyle = currentCatColor;
                    ctx.beginPath();
                    ctx.roundRect(renderX, renderY - 20, 52, 20, [10, 15, 5, 5]);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(renderX + 46, renderY - 12, 10, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = currentCatDarkColor;
                    ctx.beginPath();
                    ctx.moveTo(renderX + 38, renderY - 20);
                    ctx.lineTo(renderX + 32, renderY - 24);
                    ctx.lineTo(renderX + 42, renderY - 20);
                    ctx.fill();

                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(renderX + 49, renderY - 14, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(renderX + 50, renderY - 14, 1.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = currentCatColor;
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(renderX, renderY - 10);
                    ctx.quadraticCurveTo(renderX - 12, renderY - 18 + (this.animFrame % 2) * 4, renderX - 10, renderY - 24);
                    ctx.stroke();

                } else {
                    const h = this.height;
                    const w = this.width;

                    ctx.fillStyle = currentCatColor;
                    ctx.beginPath();
                    ctx.roundRect(renderX + 4, renderY - h + 10, w - 8, h - 14, 12);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(renderX + w - 10, renderY - h + 12, 13, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = currentCatDarkColor;
                    ctx.beginPath();
                    ctx.moveTo(renderX + w - 18, renderY - h + 4);
                    ctx.lineTo(renderX + w - 14, renderY - h - 5);
                    ctx.lineTo(renderX + w - 8, renderY - h + 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(renderX + w - 10, renderY - h + 2);
                    ctx.lineTo(renderX + w - 4, renderY - h - 5);
                    ctx.lineTo(renderX + w + 2, renderY - h + 4);
                    ctx.fill();

                    ctx.fillStyle = '#f472b6';
                    ctx.beginPath();
                    ctx.moveTo(renderX + w - 16, renderY - h + 3);
                    ctx.lineTo(renderX + w - 14, renderY - h - 2);
                    ctx.lineTo(renderX + w - 10, renderY - h + 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(renderX + w - 6, renderY - h + 10, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(renderX + w - 5, renderY - h + 10, 1.8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#f472b6';
                    ctx.beginPath();
                    ctx.arc(renderX + w - 1, renderY - h + 14, 1.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = currentCatColor;
                    ctx.lineWidth = 4.5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(renderX + 6, renderY - 20);
                    const tailWiggle = this.isGrounded ? Math.sin(Date.now() * 0.01) * 6 : 0;
                    ctx.quadraticCurveTo(renderX - 10, renderY - 35 + tailWiggle, renderX - 6, renderY - 42 + tailWiggle);
                    ctx.stroke();

                    ctx.fillStyle = currentCatDarkColor;
                    const legOffset = Math.sin(this.animFrame * Math.PI / 2) * 8;
                    
                    if (this.isGrounded) {
                        ctx.fillRect(renderX + w - 16 + legOffset, renderY - 8, 4, 8);
                        ctx.fillRect(renderX + w - 12 - legOffset, renderY - 8, 4, 8);
                        ctx.fillRect(renderX + 8 - legOffset, renderY - 8, 4, 8);
                        ctx.fillRect(renderX + 14 + legOffset, renderY - 8, 4, 8);
                    } else {
                        ctx.fillRect(renderX + w - 16, renderY - 12, 5, 6);
                        ctx.fillRect(renderX + 10, renderY - 12, 5, 6);
                    }
                }

                ctx.restore();
            }
        }

        class Obstacle {
            constructor(type, x) {
                this.type = type;
                this.x = x;
                this.markedForDeletion = false;

                if (type === 'yarn') {
                    this.width = 30;
                    this.height = 30;
                    this.y = GROUND_Y;
                    this.color = '#ec4899';
                } else if (type === 'milk') {
                    this.width = 24;
                    this.height = 38;
                    this.y = GROUND_Y;
                    this.color = '#38bdf8';
                } else if (type === 'trap') {
                    this.width = 36;
                    this.height = 20;
                    this.y = GROUND_Y;
                    this.color = '#94a3b8';
                } else if (type === 'bird') {
                    this.width = 38;
                    this.height = 26;
                    this.y = GROUND_Y - (Math.random() > 0.5 ? 25 : 55);
                    this.color = '#f59e0b';
                    this.wingState = 0;
                }
            }

            update(speed, dt) {
                this.x -= speed;
                if (this.x + this.width < -50) {
                    this.markedForDeletion = true;
                }

                if (this.type === 'bird') {
                    this.wingState += dt * 8;
                }
            }

            getHitbox() {
                return {
                    x: this.x + 3,
                    y: this.y - this.height + 3,
                    width: this.width - 6,
                    height: this.height - 6
                };
            }

            draw(ctx, scale) {
                ctx.save();
                ctx.scale(scale, scale);

                if (this.type === 'yarn') {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x + 15, this.y - 15, 15, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#f472b6';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + 12, this.y - 15, 10, 0, Math.PI * 1.5);
                    ctx.stroke();

                } else if (this.type === 'milk') {
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillRect(this.x, this.y - 30, 24, 30);
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - 30);
                    ctx.lineTo(this.x + 12, this.y - 38);
                    ctx.lineTo(this.x + 24, this.y - 30);
                    ctx.fill();
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(this.x + 4, this.y - 20, 16, 12);

                } else if (this.type === 'trap') {
                    ctx.fillStyle = '#b45309';
                    ctx.fillRect(this.x, this.y - 8, 36, 8);
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(this.x + 4, this.y - 18, 14, 10);
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(this.x + 24, this.y - 12, 6, 4);

                } else if (this.type === 'bird') {
                    const wing = Math.sin(this.wingState) * 10;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.ellipse(this.x + 20, this.y - 12, 16, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#d97706';
                    ctx.beginPath();
                    ctx.moveTo(this.x + 16, this.y - 12);
                    ctx.lineTo(this.x + 24, this.y - 12 - wing);
                    ctx.lineTo(this.x + 28, this.y - 12);
                    ctx.fill();
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.moveTo(this.x + 4, this.y - 12);
                    ctx.lineTo(this.x - 4, this.y - 9);
                    ctx.lineTo(this.x + 4, this.y - 6);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, vx, vy, type) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.type = type;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
                this.size = Math.random() * 5 + 3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw(ctx, scale) {
                if (this.life <= 0) return;
                ctx.save();
                ctx.scale(scale, scale);
                ctx.globalAlpha = Math.max(0, this.life);

                if (this.type === 'dust') {
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'heart') {
                    ctx.fillStyle = '#f43f5e';
                    ctx.font = '14px sans-serif';
                    ctx.fillText('❤️', this.x, this.y);
                }

                ctx.restore();
            }
        }

        let particles = [];

        function createDustParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                particles.push(new Particle(
                    x + (Math.random() - 0.5) * 15,
                    y - Math.random() * 4,
                    (Math.random() - 0.5) * 2 - 2,
                    -Math.random() * 2,
                    'dust'
                ));
            }
        }

        function createMilestoneFX() {
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(
                    player.x + 20 + (Math.random() - 0.5) * 40,
                    player.y - 30 + (Math.random() - 0.5) * 40,
                    (Math.random() - 0.5) * 4,
                    -Math.random() * 3 - 1,
                    'heart'
                ));
            }
        }

        class Environment {
            constructor() {
                this.groundX = 0;
                this.clouds = [
                    { x: 100, y: 50, speed: 0.5, size: 40 },
                    { x: 400, y: 80, speed: 0.3, size: 60 },
                    { x: 700, y: 40, speed: 0.6, size: 35 }
                ];
            }

            update(gameSpeed) {
                this.groundX = (this.groundX - gameSpeed) % 40;

                this.clouds.forEach(c => {
                    c.x -= c.speed;
                    if (c.x < -100) c.x = VIRTUAL_WIDTH + 100;
                });
            }

            drawBg(ctx, scale) {
                ctx.save();
                ctx.scale(scale, scale);

                ctx.fillStyle = currentTheme.bgSky;
                ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

                ctx.fillStyle = currentTheme.sunMoon;
                ctx.beginPath();
                ctx.arc(700, 60, 24, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = currentTheme.bgClouds;
                this.clouds.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                    ctx.arc(c.x + c.size * 0.5, c.y - c.size * 0.2, c.size * 0.7, 0, Math.PI * 2);
                    ctx.arc(c.x + c.size, c.y, c.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.fillStyle = currentTheme.ground;
                ctx.fillRect(0, GROUND_Y, VIRTUAL_WIDTH, VIRTUAL_HEIGHT - GROUND_Y);

                ctx.strokeStyle = currentTheme.groundLine;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, GROUND_Y);
                ctx.lineTo(VIRTUAL_WIDTH, GROUND_Y);
                ctx.stroke();

                ctx.fillStyle = currentTheme.groundLine;
                for (let x = this.groundX; x < VIRTUAL_WIDTH; x += 40) {
                    ctx.fillRect(x, GROUND_Y + 12, 16, 3);
                    ctx.fillRect(x + 20, GROUND_Y + 28, 8, 3);
                }

                ctx.restore();
            }
        }

        const player = new CatPlayer();
        const env = new Environment();
        let obstacles = [];

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function updateTheme() {
            const cycle = Math.floor(score / 500) % 3;
            if (cycle === 0) currentTheme = themes.day;
            else if (cycle === 1) currentTheme = themes.dusk;
            else currentTheme = themes.night;
        }

        function spawnObstacles() {
            obstacleTimer++;
            if (obstacleTimer >= nextObstacleDistance) {
                obstacleTimer = 0;
                nextObstacleDistance = Math.floor(Math.random() * 50 + 60 - (gameSpeed * 2));
                if (nextObstacleDistance < 40) nextObstacleDistance = 40;

                const types = ['yarn', 'milk', 'trap'];
                if (score > 200) types.push('bird');

                const chosenType = types[Math.floor(Math.random() * types.length)];
                obstacles.push(new Obstacle(chosenType, VIRTUAL_WIDTH + 20));
            }
        }

        async function gameOver() {
            gameRunning = false;
            audio.playMeowGameOver();

            const isNewHi = score > highScore;
            if (isNewHi) {
                highScore = Math.floor(score);
                localStorage.setItem('cat_runner_hi_score', highScore);
                document.getElementById('highScoreText').textContent = String(highScore).padStart(5, '0');
            }

            document.getElementById('finalScore').textContent = Math.floor(score);
            document.getElementById('finalBest').textContent = highScore;
            document.getElementById('gameOverCatName').textContent = `${catName} hit an obstacle!`;
            
            const recordMsg = document.getElementById('newRecordMsg');
            recordMsg.classList.toggle('hidden', !isNewHi);

            document.getElementById('gameOverOverlay').classList.remove('hidden');

            // Save to Database and Local storage
            saveLocalScore(score);
            await saveScoreToFirebase(score);
        }

        function resetGame() {
            catName = document.getElementById('catNameInput').value.trim() || 'Whiskers';
            localStorage.setItem('cat_runner_name', catName);

            score = 0;
            gameSpeed = INITIAL_SPEED;
            obstacles = [];
            particles = [];
            obstacleTimer = 0;
            player.reset();
            updateUI();
            
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            
            gameRunning = true;
            isPaused = false;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            document.getElementById('scoreText').textContent = String(Math.floor(score)).padStart(5, '0');
            document.getElementById('highScoreText').textContent = String(highScore).padStart(5, '0');
        }

        function gameLoop(time) {
            if (!gameRunning || isPaused) return;

            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            score += dt * 10 * (gameSpeed / 6);
            if (gameSpeed < MAX_SPEED) {
                gameSpeed += 0.001;
            }

            if (Math.floor(score) > 0 && Math.floor(score) % 100 === 0 && Math.floor(score - dt * 10) % 100 !== 0) {
                audio.playScore();
                createMilestoneFX();
            }

            updateTheme();
            updateUI();

            const scale = canvas.width / VIRTUAL_WIDTH;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            env.update(gameSpeed);
            env.drawBg(ctx, scale);

            player.update(dt);
            player.draw(ctx, scale);

            spawnObstacles();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.update(gameSpeed, dt);
                obs.draw(ctx, scale);

                if (checkCollision(player.getHitbox(), obs.getHitbox())) {
                    gameOver();
                    return;
                }

                if (obs.markedForDeletion) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx, scale);
                if (p.life <= 0) particles.splice(i, 1);
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', (e) => {
            if (document.activeElement === document.getElementById('catNameInput')) return;

            audio.init();

            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!gameRunning && document.getElementById('startOverlay').classList.contains('hidden')) {
                    resetGame();
                } else if (!gameRunning && !document.getElementById('startOverlay').classList.contains('hidden')) {
                    resetGame();
                } else if (!isPaused) {
                    player.jump();
                }
            }

            if (e.code === 'ArrowDown') {
                e.preventDefault();
                if (gameRunning && !isPaused) {
                    player.duck(true);
                }
            }

            if (e.code === 'Escape' && gameRunning) {
                isPaused = !isPaused;
                document.getElementById('pauseOverlay').classList.toggle('hidden', !isPaused);
                if (!isPaused) {
                    lastTime = performance.now();
                    requestAnimationFrame(gameLoop);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') {
                player.duck(false);
            }
        });

        // Cat Color Picker Logic
        const colorBtns = document.querySelectorAll('.color-btn');
        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                colorBtns.forEach(b => {
                    b.classList.remove('ring-white', 'scale-110');
                    b.classList.add('ring-transparent');
                });
                btn.classList.remove('ring-transparent');
                btn.classList.add('ring-white', 'scale-110');

                currentCatColor = btn.getAttribute('data-color');
                currentCatDarkColor = btn.getAttribute('data-dark');
                drawPreviewCat();
            });
        });

        // Live Cat Preview Renderer
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');

        function drawPreviewCat() {
            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            const dummyPlayer = new CatPlayer();
            dummyPlayer.animFrame = Math.floor(Date.now() / 200) % 4;
            dummyPlayer.draw(previewCtx, 1, 30, 75);
        }

        setInterval(drawPreviewCat, 200);

        // Buttons
        document.getElementById('startBtn').addEventListener('click', () => {
            audio.init();
            resetGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            audio.init();
            resetGame();
        });

        document.getElementById('menuBtn').addEventListener('click', () => {
            document.getElementById('gameOverOverlay').classList.add('hidden');
            document.getElementById('startOverlay').classList.remove('hidden');
        });

        // Touch Control Elements
        const touchJumpBtn = document.getElementById('touchJumpBtn');
        const touchDuckBtn = document.getElementById('touchDuckBtn');

        touchJumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            audio.init();
            if (!gameRunning) resetGame();
            else player.jump();
        });

        touchDuckBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameRunning) player.duck(true);
        });

        touchDuckBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (gameRunning) player.duck(false);
        });

        // Audio Toggle
        const audioBtn = document.getElementById('audioToggleBtn');
        audioBtn.addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            audioBtn.textContent = audio.enabled ? '🔊' : '🔇';
        });

        window.onload = () => {
            resizeCanvas();
            const scale = canvas.width / VIRTUAL_WIDTH;
            env.drawBg(ctx, scale);
            player.draw(ctx, scale);
            drawPreviewCat();
            initFirebase();
        };
    </script>
